name: LittleBit quality recovery (GPU QAT)

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Hugging Face base model
        required: true
        default: Qwen/Qwen2.5-0.5B-Instruct
        type: string
      epochs:
        description: Teacher-guided QAT epochs
        required: true
        default: "3"
        type: string
      eff_bit:
        description: Effective bit budget (start at 1.0 for quality recovery)
        required: true
        default: "1.0"
        type: choice
        options:
          - "1.0"
          - "0.75"
          - "0.55"
      dataset:
        description: Samsung training dataset
        required: true
        default: wikitext2
        type: choice
        options:
          - wikitext2
          - c4_wiki

# This job intentionally requires a real CUDA/BF16 GPU runner. It must not
# silently fall back to CPU or report an untrained SVD checkpoint as recovery.
jobs:
  train-and-evaluate:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 720
    env:
      BASE_MODEL: ${{ inputs.model_id }}
      EPOCHS: ${{ inputs.epochs }}
      EFF_BIT: ${{ inputs.eff_bit }}
      DATASET: ${{ inputs.dataset }}
      LITTLEBIT_COMMIT: 42d658b0c79f76450b34b6a3547462c7cdc3e1a0
      OUTPUT_NAME: qwen25-05b-littlebit2-${{ inputs.eff_bit }}bpw
    steps:
      - name: Verify CUDA and BF16 hardware
        run: |
          nvidia-smi
          python3 - <<'PY'
          import torch
          assert torch.cuda.is_available(), "CUDA GPU is required; refusing CPU fallback"
          assert torch.cuda.is_bf16_supported(), "A BF16-capable GPU is required by Samsung's trainer"
          print("GPU:", torch.cuda.get_device_name(0))
          print("PyTorch:", torch.__version__, "CUDA:", torch.version.cuda)
          PY
      - name: Fetch pinned Samsung LittleBit source
        run: |
          git clone https://github.com/SamsungLabs/LittleBit.git littlebit-src
          git -C littlebit-src checkout "$LITTLEBIT_COMMIT"
      - name: Install training dependencies
        working-directory: littlebit-src
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch==2.8.0+cu124 --index-url https://download.pytorch.org/whl/cu124
          grep -v '^torch==' requirements.txt > /tmp/littlebit-requirements.txt
          python3 -m pip install -r /tmp/littlebit-requirements.txt
          python3 -m pip install "transformers==4.51.3" deepspeed tensorboard
      - name: Run Samsung teacher-guided LittleBit-2 QAT
        working-directory: littlebit-src
        run: |
          deepspeed --num_gpus=1 main.py \
            --model_id "$BASE_MODEL" \
            --dataset "$DATASET" \
            --save_dir ./outputs \
            --f_name "$OUTPUT_NAME" \
            --num_train_epochs "$EPOCHS" \
            --per_device_train_batch_size 1 \
            --gradient_accumulation_steps 1 \
            --lr 2e-5 \
            --warmup_ratio 0.03 \
            --l2l_loss_scale 10.0 \
            --report tensorboard \
            --quant_func SmoothSign \
            --quant_mod LittleBitLinear \
            --residual True \
            --eff_bit "$EFF_BIT" \
            --kv_factor 1.0 \
            --min_split_dim 8 \
            --split_dim 1024 \
            --use_itq True \
            --itq_n_iter 50 2>&1 | tee ../littlebit-training.log
      - name: Evaluate held-out WikiText-2 perplexity
        working-directory: littlebit-src
        run: |
          python3 eval.py \
            --model_id "./outputs/$OUTPUT_NAME" \
            --ppl_task wikitext2 \
            --zeroshot_task "" \
            --seqlen 2048 2>&1 | tee ../littlebit-evaluation.log
      - name: Upload trained checkpoint and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littlebit-qwen25-quality-recovery
          path: |
            littlebit-src/outputs/${{ env.OUTPUT_NAME }}/
            littlebit-training.log
            littlebit-evaluation.log
          if-no-files-found: warn
          retention-days: 30

  validate-openvino-cpu:
    needs: train-and-evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OUTPUT_NAME: qwen25-05b-littlebit2-${{ inputs.eff_bit }}bpw
      LITTLEBIT_COMMIT: 42d658b0c79f76450b34b6a3547462c7cdc3e1a0
      LITTLEBIT_OV_MAX_NEW_TOKENS: "32"
    steps:
      - uses: actions/checkout@v4
      - name: Download trained checkpoint
        uses: actions/download-artifact@v4
        with:
          name: littlebit-qwen25-quality-recovery
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference and OpenVINO dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.51.3" openvino safetensors accelerate numpy
      - name: Fetch pinned LittleBit loader
        run: |
          git clone https://github.com/SamsungLabs/LittleBit.git littlebit-src
          git -C littlebit-src checkout "$LITTLEBIT_COMMIT"
      - name: Validate trained checkpoint on OpenVINO CPU
        env:
          PYTHONPATH: littlebit-src
          LITTLEBIT_CHECKPOINT: ${{ github.workspace }}/artifacts/littlebit-src/outputs/${{ env.OUTPUT_NAME }}
        run: python scripts/littlebit_trained_checkpoint_openvino_probe.py
      - name: Upload OpenVINO quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littlebit-trained-openvino-quality-report
          path: artifacts/littlebit-trained-openvino-quality-report.json
          if-no-files-found: warn
          retention-days: 30
