name: OpenVINO CPU and LittleBit primitive checks

on:
  push:
    branches: ["main", "research/**"]
  pull_request:
  workflow_dispatch:

jobs:
  cpu-runtime-and-reference:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU test dependencies
        run: python -m pip install --upgrade pip numpy pytest openvino
      - name: Run binary arithmetic reference tests
        run: python -m pytest -q tests/test_littlebit_reference.py
      - name: Run OpenVINO CPU plugin smoke test
        run: python -m pytest -q tests/test_openvino_cpu.py
      - name: Compile benchmark utilities
        run: python -m compileall -q scripts tests
