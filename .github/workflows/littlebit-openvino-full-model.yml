name: LittleBit full-model OpenVINO CPU graph probe

on:
  push:
    branches: ["research/**"]
    paths:
      - "scripts/littlebit_openvino_full_model_probe.py"
      - ".github/workflows/littlebit-openvino-full-model.yml"
  workflow_dispatch:

jobs:
  full-model-openvino-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LITTLEBIT_OV_MAX_NEW_TOKENS: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install openvino safetensors "transformers==4.51.3" accelerate numpy
      - name: Fetch pinned LittleBit source
        run: |
          git clone https://github.com/SamsungLabs/LittleBit.git third_party/LittleBit
          git -C third_party/LittleBit checkout 42d658b0c79f76450b34b6a3547462c7cdc3e1a0
          echo '"""LittleBit utilities; explicit imports avoid upstream eager circular import."""' > third_party/LittleBit/quantization/utils/__init__.py
      - name: Convert and compare complete LittleBit model graph
        env:
          PYTHONPATH: third_party/LittleBit
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python scripts/littlebit_openvino_full_model_probe.py
      - name: Upload conversion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littlebit-full-model-openvino-cpu-report
          path: artifacts/littlebit-openvino-full-model-probe.json
          if-no-files-found: warn
