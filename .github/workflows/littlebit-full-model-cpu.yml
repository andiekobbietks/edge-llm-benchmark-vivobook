name: LittleBit full-model CPU checkpoint smoke test

on:
  push:
    branches: ["research/**"]
    paths:
      - "scripts/littlebit_full_model_cpu_smoke.py"
      - ".github/workflows/littlebit-full-model-cpu.yml"
  workflow_dispatch:

jobs:
  qwen25-full-model-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install openvino safetensors "transformers==4.51.3" accelerate huggingface_hub
      - name: Fetch pinned LittleBit source
        run: |
          git clone https://github.com/SamsungLabs/LittleBit.git third_party/LittleBit
          git -C third_party/LittleBit checkout 42d658b0c79f76450b34b6a3547462c7cdc3e1a0
          printf '%s\\n' '"""LittleBit utilities; explicit imports avoid upstream eager circular import."""' > third_party/LittleBit/quantization/utils/__init__.py
      - name: Convert, save, reload and generate on CPU
        env:
          PYTHONPATH: third_party/LittleBit
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python scripts/littlebit_full_model_cpu_smoke.py
      - name: Upload CPU smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littlebit-qwen25-full-model-cpu-report
          path: artifacts/qwen25-05b-littlebit-cpu/
          if-no-files-found: warn
