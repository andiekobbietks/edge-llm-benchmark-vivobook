name: Python checks

on:
  push:
    branches: ["main", "research/**"]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile benchmark scripts
        run: python -m compileall -q scripts
